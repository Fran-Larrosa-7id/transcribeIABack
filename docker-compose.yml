services:
  postgres:
    image: postgres:16
    container_name: transcribe_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcribe_ai
    ports:
      - "5432:5432"
    volumes:
      - transcribe_ai_postgres_data:/var/lib/postgresql/data

volumes:
  transcribe_ai_postgres_data: